# File: /etc/nohang/nohang-desktop.conf
psi_checking_enabled = True
psi_path = /proc/pressure/memory
psi_metrics = some_avg10

# Trigger reclaim actions when threads spend over 40ms stalling during a 10s window
psi_threshold_some_avg10 = 40.0

# Define physical memory constraints
soft_threshold_min_mem = 6 %
hard_threshold_min_mem = 3 %
soft_threshold_min_swap = 8 %
hard_threshold_min_swap = 4 %

# Verification checking frequency (in milliseconds)
low_memory_check_rate = 200
normal_memory_check_rate = 1000

# Victim Selection Rules: Negative adjustments protect processes; positive adjustments prioritize them for eviction
@BADNESS_ADJ_RE_REALPATH -1000 /// ^(/usr/bin/labwc|/usr/bin/sfwbar|/usr/bin/dbus-daemon)$
@BADNESS_ADJ_RE_NAME -1000 /// ^(labwc|sfwbar|dbus-daemon)$

# Safeguard initialization and service processes
@BADNESS_ADJ_RE_REALPATH -900 /// ^(/usr/sbin/runsvdir|/usr/sbin/runsv|/usr/sbin/udevd)$

# Target runaway processes and memory-heavy web containers
@BADNESS_ADJ_RE_NAME 500 /// ^(chrome|firefox|brave|chromium|Web Content|Privileged Cont)$
@BADNESS_ADJ_RE_REALPATH 450 /// ^(/usr/lib/.*)$

# Prioritize terminating Wine processes to protect native host execution paths
@BADNESS_ADJ_RE_NAME 600 /// ^(wine-preloader|wine64-preloader|wineserver)$
