# Touchpad gesture configuration for Aetheris OS
# Maps multi-finger gestures to desktop and workspace actions under Labwc.

# 4-finger swipes: Switch workspaces
gesture swipe left 4  labwc-action workspace-left
gesture swipe right 4 labwc-action workspace-right

# 3-finger swipes: Application overview and show desktop
gesture swipe up 3   labwc-action overview
gesture swipe down 3 labwc-action show-desktop
