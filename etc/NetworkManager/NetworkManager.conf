# NetworkManager configuration for Aetheris OS
# Configures stable-ssid MAC address randomization for Wi-Fi and stable MAC for Ethernet.

[main]
plugins=keyfile

[connection]
# Use stable-ssid for Wi-Fi: MAC changes per SSID, but remains stable for the same network to preserve DHCP/auth.
wifi.cloned-mac-address=stable-ssid

# Use stable for Ethernet: MAC address is randomized but remains stable for the connection.
ethernet.cloned-mac-address=stable
