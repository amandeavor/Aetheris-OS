# File: /etc/sysctl.d/99-aetheris-memory.conf
# Force anonymous memory allocations into compressed ZRAM early
vm.swappiness = 150

# Keep directory structures and file index systems cached in physical RAM
vm.vfs_cache_pressure = 50

# Set dirty page background flushes to trigger at 16MB of system writes
vm.dirty_background_bytes = 16777216

# Force blocking processes to serialize writes once unwritten dirty pages hit 32MB
vm.dirty_bytes = 33554432

# Allow dirty data to remain unwritten for a maximum of 30 seconds
vm.dirty_expire_centisecs = 3000

# Increase the frequency of flushing operations to prevent drive queue saturation
vm.dirty_writeback_centisecs = 1500

# Process single swap allocation actions sequentially to maximize zstd CPU throughput
vm.page-cluster = 0

# Multi-Generational LRU (MGLRU) tuning to optimize page cache scans
vm.lru_gen_min_ttl_ms = 1000

# Disable watermark boost to prevent background memory scanning stalls
vm.watermark_boost_factor = 0

# Disable proactive memory compaction to prevent allocation latency spikes
vm.compaction_proactiveness = 0
