# File: /etc/sysctl.d/99-hardened.conf
# Aetheris OS Security Hardening Parameters

# Prevent kernel pointer leaks
kernel.kptr_restrict = 2

# Restrict dmesg access to root user only
kernel.dmesg_restrict = 1

# Disable unprivileged BPF execution
kernel.unprivileged_bpf_disabled = 1

# System-wide ptrace restrictions (Yama ptrace scope)
kernel.yama.ptrace_scope = 2

# Disable core dumps system-wide
kernel.core_pattern = |/bin/false

# Enforce full Address Space Layout Randomization (ASLR)
kernel.randomize_va_space = 2

# TCP SYN flood protection
net.ipv4.tcp_syncookies = 1

# Source route verification (Reverse Path Filtering)
net.ipv4.conf.all.rp_filter = 1

# Do not accept ICMP redirect messages
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# Do not send ICMP redirect messages
net.ipv4.conf.all.send_redirects = 0

# Do not accept source routed packets
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Ignore broadcast ICMP echo requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Restrict unprivileged user namespace cloning
kernel.unprivileged_userns_clone = 0
