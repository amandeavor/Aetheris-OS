[package]
name = "velocityinstall"
version = "0.1.0"
description = "Aetheris OS Installer"
authors = ["Aetheris OS Installer Team <installer@aetheris-os.org>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
uuid = { version = "1.7", features = ["v4"] }
libc = "0.2"
toml = "1.1"
landlock = "0.3"


